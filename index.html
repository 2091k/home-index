    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f172a;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(45deg, #1e3a8a, #0f172a);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 20px 80px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            place-items: center;
        }

        .nav-item {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #60a5fa, #38bdf8);
            -webkit-background-clip: text;
            color: transparent;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            padding: 2rem;
            border-radius: 1.5rem;
            width: 90%;
            max-width: 400px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease-out;
        }

        .modal.show .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .close {
            position: absolute;
            right: 1rem;
            top: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #94a3b8;
        }

        .site-link {
            display: block;
            padding: 1rem;
            margin: 0.5rem 0;
            background: rgba(255,255,255,0.05);
            border-radius: 0.8rem;
            color: #fff;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .site-link:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 99;
        }

        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-item {
                padding: 1.2rem;
            }
            
            h2 {
                font-size: 1.3rem;
            }
        }
    </style>

    <script>
        // 弹窗控制逻辑
        const modal = document.getElementById('myModal');

        function openModal() {
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // 点击外部关闭弹窗
        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }

        // 禁用背景滚动
        document.addEventListener('wheel', (e) => {
            if (modal.style.display === 'flex') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
