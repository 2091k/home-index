<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱喝胡辣汤资源导航中心 - 2091K</title>
    <style>
        /* ============================================================
           主题样式表（暗色霓虹 · 深空底色 + 流动线条画布 + 三段渐变）
           合并自原 theme.css + 微信公众号教程同款样式
           ============================================================ */

        /* ===== 主题变量 ===== */
        :root {
            --bg-deep: #0a0e17;        /* 深空底色 */
            --bg-card: #111827;        /* 卡片底色 */
            --bg-card-hover: #1a2332;  /* 卡片悬停色 */
            --accent: #38bdf8;         /* 主色 · 青 */
            --accent2: #a78bfa;        /* 辅色 · 紫 */
            --accent3: #34d399;        /* 点缀 · 绿 */
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-bright: #f8fafc;
            --border: rgba(56, 189, 248, 0.15);
            --glow: rgba(56, 189, 248, 0.4);
            --grad-title: linear-gradient(120deg, var(--accent) 0%, var(--accent2) 60%, var(--accent3) 100%);
        }

        /* ===== 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                "Noto Sans CJK SC", sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* ===== 流动线条画布（背景层）===== */
        #flow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 所有内容压在画布之上 */
        .page {
            position: relative;
            z-index: 1;
        }

        /* ===== 顶部横幅 ===== */
        header {
            text-align: center;
            padding: 2rem 0;
            background:
                radial-gradient(ellipse 80% 90% at 50% 0%, rgba(56,189,248,0.10), transparent 65%),
                radial-gradient(ellipse 60% 70% at 25% 10%, rgba(167,139,250,0.08), transparent 55%),
                radial-gradient(ellipse 60% 70% at 75% 10%, rgba(52,211,153,0.08), transparent 55%);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-bright);
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-dim);
        }

        /* 顶部「一言」副标题：小字号 */
        #hitokoto {
            font-size: 0.95rem;
            padding: 0 10px;
        }

        /* 标题里的渐变文字（如需高亮某段，用 <span class="grad">） */
        .grad {
            background: var(--grad-title);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 教程同款：顶部徽章（配合 <span class="hero-badge">） */
        .hero-badge {
            display: inline-block;
            padding: 6px 18px;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent);
            background: rgba(56,189,248,0.08);
            border: 1px solid rgba(56,189,248,0.25);
            border-radius: 999px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* 教程同款：顶部状态徽章组（.meta / .chip / .dot） */
        .meta {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(17,24,39,0.5);
            white-space: nowrap;
        }

        .meta .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent3);
            box-shadow: 0 0 8px var(--accent3);
        }

        /* ===== 导航区 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 20px 80px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            place-items: center;
        }

        /* ===== 卡片 ===== */
        .nav-item {
            width: 100%;
            max-width: 320px;
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            text-decoration: none;
            display: block;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        /* 卡片顶部渐变光线（悬停时浮现） */
        .nav-item::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            opacity: 0;
            transition: opacity .3s;
        }

        .nav-item:hover {
            background: var(--bg-card-hover);
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 28px rgba(56, 189, 248, 0.12);
        }

        .nav-item:hover::before {
            opacity: 1;
        }

        .nav-item h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: var(--grad-title);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .nav-item p {
            color: var(--text-dim);
        }

        /* ===== 弹窗 ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.78);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.96);
            padding: 2rem;
            border-radius: 1.5rem;
            width: 90%;
            max-width: 400px;
            position: relative;
            border: 1px solid var(--border);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease-out;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }

        .modal.show .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-content h3 {
            color: var(--text-bright);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .close {
            position: absolute;
            right: 1rem;
            top: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: color .2s;
            line-height: 1;
        }

        .close:hover {
            color: var(--accent);
        }

        .site-link {
            display: block;
            padding: 1rem;
            margin: 0.5rem 0;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .site-link:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateX(5px);
            color: var(--text-bright);
        }

        /* ===== 页脚 ===== */
        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 99;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(ellipse 60% 120% at 50% 100%,
                rgba(167, 139, 250, 0.08), rgba(10, 14, 23, 0.85));
            border-top: 1px solid var(--border);
        }

        footer p {
            color: var(--text-dim);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .nav-item {
                padding: 1.2rem;
                transform: scale(0.95);
                transition: none;
            }

            .nav-item h2 {
                font-size: 1.3rem;
            }

            body {
                padding-bottom: 60px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1.5rem 0;
            }

            header h1 {
                font-size: 2rem;
                margin-bottom: 0.3rem;
            }

            .container {
                padding: 1rem 10px 70px;
            }

            .nav-item {
                max-width: 100%;
                padding: 1rem;
                border-radius: 1rem;
            }

            .nav-item h2 {
                font-size: 1.2rem;
            }

            .nav-item p {
                font-size: 0.9rem;
            }

            .meta {
                gap: 6px;
            }

            .meta .chip {
                font-size: 11px;
                padding: 4px 10px;
            }

            footer {
                padding: 1rem;
                background: rgba(10, 14, 23, 0.9);
            }

            footer p {
                font-size: 0.8rem;
            }

            .modal-content {
                width: 95%;
                max-width: 340px;
                padding: 1.5rem;
            }

            .site-link {
                padding: 0.8rem;
                font-size: 0.9rem;
            }
        }
    </style>

    <script>
        // ===== 流动线条画布 =====
        (function () {
            var canvas = document.getElementById('flow-canvas');
            var ctx = canvas.getContext('2d');
            var W, H, dpr;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            function makeLine() {
                var side = Math.random();
                var start;
                if (side < 0.35) {
                    start = { x: -20, y: Math.random() * H };
                } else if (side < 0.7) {
                    start = { x: W + 20, y: Math.random() * H };
                } else {
                    start = { x: Math.random() * W, y: H + 20 };
                }
                var colors = [
                    'rgba(56,189,248,',   // sky
                    'rgba(167,139,250,',  // violet
                    'rgba(52,211,153,',   // emerald
                    'rgba(34,211,238,'    // cyan
                ];
                return {
                    x: start.x,
                    y: start.y,
                    vx: (start.x < W / 2 ? 1 : -1) * (0.2 + Math.random() * 0.4),
                    vy: (start.y < H ? -1 : 0) * (0.05 + Math.random() * 0.15) * (Math.random() < 0.5 ? 1 : -1),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    w: 0.6 + Math.random() * 1.2,
                    trail: []
                };
            }

            var lines = [];
            var LINE_COUNT = Math.min(60, Math.max(24, Math.floor(W * H / 22000)));
            for (var i = 0; i < LINE_COUNT; i++) lines.push(makeLine());

            var t = 0;
            function step() {
                t += 0.008;
                ctx.clearRect(0, 0, W, H);

                // 背景淡网格
                ctx.strokeStyle = 'rgba(56,189,248,0.025)';
                ctx.lineWidth = 1;
                var gs = 60;
                for (var gx = 0; gx < W; gx += gs) {
                    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
                }
                for (var gy = 0; gy < H; gy += gs) {
                    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
                }

                // 流动线
                for (var i = 0; i < lines.length; i++) {
                    var L = lines[i];
                    L.x += L.vx;
                    L.y += L.vy + Math.sin(t + i * 0.7) * 0.25;

                    L.trail.push({ x: L.x, y: L.y });
                    if (L.trail.length > 42) L.trail.shift();

                    for (var j = 1; j < L.trail.length; j++) {
                        var a = (j / L.trail.length) * 0.55;
                        var p0 = L.trail[j - 1], p1 = L.trail[j];
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = L.color + a + ')';
                        ctx.lineWidth = L.w * (j / L.trail.length);
                        ctx.stroke();
                    }

                    var grad = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, 14);
                    grad.addColorStop(0, L.color + '0.9)');
                    grad.addColorStop(1, L.color + '0)');
                    ctx.beginPath();
                    ctx.fillStyle = grad;
                    ctx.arc(L.x, L.y, 14, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.fillStyle = L.color + '0.95)';
                    ctx.arc(L.x, L.y, 1.6, 0, Math.PI * 2);
                    ctx.fill();

                    if (L.x < -40 || L.x > W + 40 || L.y < -40 || L.y > H + 40) {
                        lines[i] = makeLine();
                    }
                }

                // 连接近线
                ctx.lineWidth = 0.5;
                for (var a = 0; a < lines.length; a++) {
                    for (var b = a + 1; b < lines.length; b++) {
                        var dx = lines[a].x - lines[b].x;
                        var dy = lines[a].y - lines[b].y;
                        var d2 = dx * dx + dy * dy;
                        if (d2 < 13000) {
                            var alpha = (1 - Math.sqrt(d2) / 114) * 0.12;
                            ctx.beginPath();
                            ctx.moveTo(lines[a].x, lines[a].y);
                            ctx.lineTo(lines[b].x, lines[b].y);
                            ctx.strokeStyle = 'rgba(56,189,248,' + alpha + ')';
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(step);
            }
            step();
        })();

        // 弹窗控制逻辑
        const modal = document.getElementById('myModal');

        function openModal() {
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // 点击外部关闭弹窗
        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }

        // 禁用背景滚动
        document.addEventListener('wheel', (e) => {
            if (modal.style.display === 'flex') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
