    <script>
        // ===== 流动线条画布 =====
        (function () {
            var canvas = document.getElementById('flow-canvas');
            var ctx = canvas.getContext('2d');
            var W, H, dpr;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            function makeLine() {
                var side = Math.random();
                var start;
                if (side < 0.35) {
                    start = { x: -20, y: Math.random() * H };
                } else if (side < 0.7) {
                    start = { x: W + 20, y: Math.random() * H };
                } else {
                    start = { x: Math.random() * W, y: H + 20 };
                }
                var colors = [
                    'rgba(56,189,248,',   // sky
                    'rgba(167,139,250,',  // violet
                    'rgba(52,211,153,',   // emerald
                    'rgba(34,211,238,'    // cyan
                ];
                return {
                    x: start.x,
                    y: start.y,
                    vx: (start.x < W / 2 ? 1 : -1) * (0.2 + Math.random() * 0.4),
                    vy: (start.y < H ? -1 : 0) * (0.05 + Math.random() * 0.15) * (Math.random() < 0.5 ? 1 : -1),
                    color: colors[Math.floor(Math.random() * colors.length)],
                    w: 0.6 + Math.random() * 1.2,
                    trail: []
                };
            }

            var lines = [];
            var LINE_COUNT = Math.min(60, Math.max(24, Math.floor(W * H / 22000)));
            for (var i = 0; i < LINE_COUNT; i++) lines.push(makeLine());

            var t = 0;
            function step() {
                t += 0.008;
                ctx.clearRect(0, 0, W, H);

                // 背景淡网格
                ctx.strokeStyle = 'rgba(56,189,248,0.025)';
                ctx.lineWidth = 1;
                var gs = 60;
                for (var gx = 0; gx < W; gx += gs) {
                    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
                }
                for (var gy = 0; gy < H; gy += gs) {
                    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
                }

                // 流动线
                for (var i = 0; i < lines.length; i++) {
                    var L = lines[i];
                    L.x += L.vx;
                    L.y += L.vy + Math.sin(t + i * 0.7) * 0.25;

                    L.trail.push({ x: L.x, y: L.y });
                    if (L.trail.length > 42) L.trail.shift();

                    for (var j = 1; j < L.trail.length; j++) {
                        var a = (j / L.trail.length) * 0.55;
                        var p0 = L.trail[j - 1], p1 = L.trail[j];
                        ctx.beginPath();
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.strokeStyle = L.color + a + ')';
                        ctx.lineWidth = L.w * (j / L.trail.length);
                        ctx.stroke();
                    }

                    var grad = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, 14);
                    grad.addColorStop(0, L.color + '0.9)');
                    grad.addColorStop(1, L.color + '0)');
                    ctx.beginPath();
                    ctx.fillStyle = grad;
                    ctx.arc(L.x, L.y, 14, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.fillStyle = L.color + '0.95)';
                    ctx.arc(L.x, L.y, 1.6, 0, Math.PI * 2);
                    ctx.fill();

                    if (L.x < -40 || L.x > W + 40 || L.y < -40 || L.y > H + 40) {
                        lines[i] = makeLine();
                    }
                }

                // 连接近线
                ctx.lineWidth = 0.5;
                for (var a = 0; a < lines.length; a++) {
                    for (var b = a + 1; b < lines.length; b++) {
                        var dx = lines[a].x - lines[b].x;
                        var dy = lines[a].y - lines[b].y;
                        var d2 = dx * dx + dy * dy;
                        if (d2 < 13000) {
                            var alpha = (1 - Math.sqrt(d2) / 114) * 0.12;
                            ctx.beginPath();
                            ctx.moveTo(lines[a].x, lines[a].y);
                            ctx.lineTo(lines[b].x, lines[b].y);
                            ctx.strokeStyle = 'rgba(56,189,248,' + alpha + ')';
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(step);
            }
            step();
        })();

        // 弹窗控制逻辑
        const modal = document.getElementById('myModal');

        function openModal() {
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // 点击外部关闭弹窗
        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }

        // 禁用背景滚动
        document.addEventListener('wheel', (e) => {
            if (modal.style.display === 'flex') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
